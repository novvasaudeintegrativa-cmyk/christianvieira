<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Christian Vieira — Imóveis & Consultoria</title>
  <meta name="description" content="Corretor de imóveis no Rio de Janeiro. Site em breve.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0D1B2A;
      --gold: #B8962E;
      --green: #25D366;
      --green-dark: #20c157;
      --white: #ffffff;
    }

    body {
      min-height: 100vh;
      background: var(--navy);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Glow de fundo */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(37,211,102,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .badge {
      width: 56px;
      height: 56px;
      background: var(--green);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0 auto 24px;
    }

    .name {
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .sub {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: var(--green);
      margin: 0 auto 40px;
      border-radius: 2px;
    }

    .message {
      font-size: clamp(15px, 2.5vw, 18px);
      line-height: 1.7;
      color: rgba(255,255,255,0.65);
      max-width: 480px;
      margin-bottom: 48px;
    }

    .message strong {
      color: var(--white);
      font-weight: 700;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--green);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 10px;
      transition: background 0.2s, transform 0.15s;
    }
    .cta:hover {
      background: var(--green-dark);
      transform: translateY(-1px);
    }
    .cta svg { flex-shrink: 0; }

    .creci {
      margin-top: 48px;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.25);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

</body>
</html>
