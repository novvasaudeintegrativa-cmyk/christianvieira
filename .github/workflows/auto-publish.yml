name: Auto-publicar post do blog

on:
  # Toda terça e quinta às 11:00 UTC (08:00 BRT) — 2x/semana, garante publicação no horário do calendário
  schedule:
    - cron: '0 11 * * 2'
    - cron: '0 11 * * 4'

  # Disparo manual pela aba "Actions" do GitHub (útil para publicar posts atrasados)
  workflow_dispatch:
    inputs:
      post_num:
        description: 'Número do post para forçar (ex: 3). Deixe vazio para o próximo pendente.'
        required: false
        default: ''

permissions:
  contents: write  # necessário para commit + push

jobs:
  gerar-e-publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          # token com permissão de write para poder fazer push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.post_num }}" ]; then
            node scripts/generate-post.js --num=${{ github.event.inputs.post_num }}
          else
            node scripts/generate-post.js
          fi

      - name: Commit e push (se houver mudancas)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Sempre sincroniza o indice — necessario mesmo quando o post ja
          # foi gerado com antecedencia (o HTML/imagem ja existem, mas so
          # entram no blog/index.html quando a data chega).
          node scripts/sync-blog-index.js

          git add blog/posts/ blog/images/ blog/index.html
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca — post ja publicado ou nenhum estava pendente."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            POST_TITLE=$(node -e "
              const s = require('./blog/posts-schedule.json');
              const today = new Date(); today.setHours(23,59,59,0);
              const post = s.posts
                .filter(p => new Date(p.date+'T00:00:00') <= today)
                .sort((a,b) => new Date(b.date)-new Date(a.date))[0];
              console.log(post ? post.title : 'post');
            ")
            git commit -m "post: $(date +%Y-%m-%d) — $POST_TITLE"
            git push
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notificar Google Calendar (lembrete de Reimplantar na Hostinger)
        if: steps.commit.outputs.published == 'true' && env.WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CALENDAR_WEBHOOK }}
        run: |
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"⚠️ Novo post gerado — clique Reimplantar na Hostinger: ${{ steps.commit.outputs.post_title }}\",\"date\":\"${{ steps.commit.outputs.post_date }}\",\"num\":\"${{ steps.commit.outputs.post_num }}\",\"url\":\"${{ steps.commit.outputs.post_url }}\"}"
