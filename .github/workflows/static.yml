name: Deploy — GitHub Pages + Hostinger FTP

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── 1. Deploy para GitHub Pages (staging / backup) ──────────────────────────
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync blog index
        id: sync
        run: node scripts/sync-blog-index.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ── 2. Deploy para Hostinger via FTP (site de produção) ─────────────────────
  # DESATIVADO em 2026-07-21: FTP, FTPS e SFTP reportam sucesso mas os arquivos
  # nao chegam de fato ao public_html servido pelo site (confirmado com 4
  # clientes/protocolos diferentes; edicao direta pelo File Manager funciona
  # instantaneamente). Aparenta ser bug de infraestrutura do lado da
  # Hostinger — aguardando retorno do suporte antes de reativar.
  deploy-hostinger:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync blog index
        id: sync
        run: node scripts/sync-blog-index.js

      - name: Deploy via SFTP para Hostinger
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: u361926314
          server: 212.85.6.146
          port: 65002
          password: ${{ secrets.SSH_PASSWORD }}
          local_path: './*'
          remote_path: 'public_html/'
          sftp_only: true
          rsyncArgs: '--exclude=.git --exclude=node_modules --exclude=.env* --exclude=.aios-core --exclude=skills'

      - name: Notificar Google Calendar
        if: success() && env.WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CALENDAR_WEBHOOK }}
        run: |
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"✅ Blog publicado: ${{ steps.sync.outputs.post_title }}\",\"date\":\"${{ steps.sync.outputs.post_date }}\",\"num\":\"${{ steps.sync.outputs.post_num }}\",\"url\":\"${{ steps.sync.outputs.post_url }}\"}"
