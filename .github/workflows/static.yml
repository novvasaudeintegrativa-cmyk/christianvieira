name: Deploy — GitHub Pages + Hostinger FTP

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── 1. Deploy para GitHub Pages (staging / backup) ──────────────────────────
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync blog index
        id: sync
        run: node scripts/sync-blog-index.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ── 2. Deploy para Hostinger via FTP (site de produção) ─────────────────────
  # DESATIVADO em 2026-07-22: o FTP tinha um bug de sincronizacao do lado da
  # Hostinger (arquivos gravados via FTP nao refletiam no site, confirmado
  # com o suporte deles). A solucao definitiva foi conectar o repositorio
  # diretamente via GIT no hPanel (Sites > Avancado > GIT), que faz
  # deploy por "git pull" real. Por enquanto a implantacao la e manual
  # (botao "Reimplantar" no hPanel) — falta configurar o webhook de
  # auto-deploy. Este job de FTP fica desativado, mantido soh como
  # referencia/fallback.
  deploy-hostinger:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync blog index
        id: sync
        run: node scripts/sync-blog-index.js

      - name: Deploy via FTP para Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /
          port: 21
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env*
            .aios-core/**
            skills/**

      - name: Notificar Google Calendar
        if: success() && env.WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CALENDAR_WEBHOOK }}
        run: |
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"✅ Blog publicado: ${{ steps.sync.outputs.post_title }}\",\"date\":\"${{ steps.sync.outputs.post_date }}\",\"num\":\"${{ steps.sync.outputs.post_num }}\",\"url\":\"${{ steps.sync.outputs.post_url }}\"}"
